<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Archive Library</title>
  <meta name="description" content="Archive personnelle de notes scientifiques en images.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { margin-bottom: 10px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 30px;
    }
    a.card {
      display: block;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
      text-decoration: none;
      color: black;
      transition: 0.2s;
    }
    a.card:hover {
      border-color: #000;
    }
    .muted { color: #666; }
  </style>
</head>

<body>
  <h1>Archive Library</h1>
  <p class="muted">Notes personnelles — classement par discipline</p>

  <div class="grid">
    <a class="card" href="neuro.html">Neurologie</a>
    <a class="card" href="cardio.html">Cardio-respiratoire</a>
    <a class="card" href="ortho.html">Ortho / Traumato</a>
    <a class="card" href="gyn.html">Gynéco / Obstétrique</a>
  </div>
</body>
</html>
